<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Food Price Optimizer{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <!-- Navigation Bar -->
    <header class="navbar">
      <a href="{{ url_for('dashboard') }}" class="logo">
        <img
          src="{{ url_for('static', filename='images/LOGO.png') }}"
          alt="Food Price Optimizer logo"
          class="logo-mark"
        />
        <div class="brand-text">
          <p class="brand-name">Food Price Optimizer</p>
          <p class="brand-description">Look for GOAT here</p>
        </div>
      </a>

      <form class="search-bar" action="#">
        <input
          type="search"
          name="q"
          placeholder="Search food prices here..."
        />
        <button type="submit" aria-label="Search">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>
    </header>

    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <h3>About us</h3>
        <p>...</p>

        <div class="social-links">
          <a
            href="https://facebook.com/NBA"
            target="_blank"
            rel="noopener"
            aria-label="Facebook"
          >
            <i class="fa-brands fa-facebook-f"></i>
          </a>
          <a
            href="https://github.com/NBA"
            target="_blank"
            rel="noopener"
            aria-label="GitHub"
          >
            <i class="fa-brands fa-github"></i>
          </a>
        </div>

        <p class="credits">
          Developed by Jeff Ezekiel Belnas | Quintela, Justin Matthew |
          Trinidad, Ian Kyle
        </p>
      </div>
    </footer>

    <script src="{{ url_for('static', filename='js/js.js') }}"></script>
  </body>
</html>
